<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Amour — создай приглашение</title><link rel="stylesheet" href="/style.css"></head><body>
<header><a class="logo" href="/">♡ amour</a><button onclick="document.querySelector('#builder').scrollIntoView({behavior:'smooth'})">Создать</button></header>
<main><section class="hero"><div><small>ПЕРСОНАЛЬНОЕ ПРИГЛАШЕНИЕ</small><h1>Скажи это<br><i>красиво.</i></h1><p>Создай приглашение на свидание, получи короткую ссылку и узнай ответ в Telegram.</p><button class="primary" onclick="document.querySelector('#builder').scrollIntoView({behavior:'smooth'})">Создать бесплатно →</button></div><div class="hero-card">♥<strong>Пойдём<br>на свидание?</strong><small>с любовью</small></div></section>
<section id="builder" class="builder"><small>КОНСТРУКТОР</small><h2>Твоё приглашение</h2><form id="form" class="card"><label>Имя<input name="name" required placeholder="Алина"></label><label>Обращение<input name="greeting" placeholder="Привет, моя хорошая"></label><label>Текст приглашения<textarea name="message">Хочу провести с тобой особенный вечер. Пойдём со мной на свидание? ❤️</textarea></label><div class="two"><label>Дата<input name="date" type="date" required></label><label>Время<input name="time" type="time" value="19:00"></label></div><label>Место<input name="place" placeholder="Уютное кафе"></label><label>Подпись<input name="author" placeholder="С любовью, К"></label><label>Фото<input name="photo" type="file" accept="image/*"></label><button class="primary">Создать приглашение ♥</button></form><div id="result" class="hidden card"><h2>Готово ♥</h2><p>Вот твоя короткая ссылка:</p><div class="share"><input id="url" readonly><button id="copy">Копировать</button></div><p id="status"></p><a id="open" class="primary">Открыть приглашение</a></div></section></main><footer>amour · бесплатно</footer><script src="/app.js"></script></body></html>
